name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wenji-platform/package-lock.json

      - name: Install Dependencies
        working-directory: ./wenji-platform
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./wenji-platform
        run: npx prisma generate

      - name: Build Next.js
        working-directory: ./wenji-platform
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: wenji-platform
          directory: wenji-platform/.vercel/output/static
          # 可选: 如果使用 D1 数据库
          # -d1-databases: DB=wenji-db
        env:
          NODE_OPTIONS: '--inspect'

      - name: Cloudflare Pages URL
        if: github.event_name == 'push'
        run: echo "Deployment URL: https://wenji-platform.pages.dev"