name = "wenji-platform"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages 配置
pages_build_output_dir = ".vercel/output/static"

# D1 数据库（可选，需要在 Cloudflare Dashboard 创建后填入 ID）
# [[d1_databases]]
# binding = "DB"
# database_name = "wenji-db"
# database_id = "YOUR_DATABASE_ID_HERE"

[env.production]
name = "wenji-platform-prod"

[env.staging]
name = "wenji-platform-staging"