name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Dependencies
        working-directory: ./wenji-platform
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./wenji-platform
        run: npx prisma generate

      - name: Build Next.js
        working-directory: ./wenji-platform
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        working-directory: ./wenji-platform
        run: |
          npx wrangler pages deploy .next \
            --project-name=wenji-platform \
            --commit-message="Deploy from GitHub Actions"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment URL
        if: github.event_name == 'push'
        run: echo "🎉 Deployed to: https://wenji-platform.pages.dev"